name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    name: Maven verify (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and run unit and Cucumber tests
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Run integration tests
        run: mvn --batch-mode --no-transfer-progress -Pit test
